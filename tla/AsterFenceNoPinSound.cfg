\* Companion to AsterFenceNoPin.cfg: same unpinned-GC negative model, but
\* with I2 (the Lemma R coverage invariant) removed. This run PASSES,
\* which is a finding about the implementation, not a soundness proof of
\* dropping the pin: write_plane.rs::advance_retention compacts only
\* SHADOWED revisions (the newest revision of every key survives any
\* watermark), so a key with any write event in (s, h] always keeps a live
\* witness in (s, h] and the V4 scan still catches the conflict. The pin
\* is what discharges the theorem's general GC contract (Lemma R, where
\* ANY event below the floor may vanish); it becomes load-bearing for
\* serializability the moment compaction gets more aggressive than
\* shadowed-only. See tla/RESULTS.md.
SPECIFICATION Spec
CONSTANTS
    Committers = {c1, c2}
    Keys = {k1, k2}
    MaxPos = 4
    MaxEpoch = 3
    None = None
    EpochReuse = FALSE
    RetentionPinned = FALSE
SYMMETRY Symm
INVARIANTS
    TypeOK
    I1_UniquePosition
    I3_EpochBlockOrder
    I4_NoWriteSkew
    I4a_NoStaleValidatedRead
